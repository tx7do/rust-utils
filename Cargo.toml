[package]
name = "rust-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A Rust toolbox: string/slice/map helpers, case conversion, math, ids, pagination, query parsing, DDL parsing, event loop and more."
license = "MIT"
repository = "https://github.com/tx7do/rust-utils"
readme = "README.md"
keywords = ["utils", "toolbox", "stringcase", "snowflake", "pagination"]
categories = ["development-tools", "utilities"]
# 62MB 的 GeoLite2 测试库只服务单测(assets/geoip/README.md),不进发布包;
# 测试从 CARGO_MANIFEST_DIR 运行时读取,包内缺失时用例自行跳过。
exclude = ["assets/geoip", "assets/jwt"]

[features]
default = []

# Time helpers (dateutil / timeutil), built on chrono.
chrono = ["dep:chrono"]
# JSON-flavored query parsing and JSON field rewriting.
json = ["dep:serde_json"]
# Field masks over serde_json::Value (nested mask tree, filter/prune/overwrite/validate).
fieldmask = ["dep:serde_json"]
# Random toolkit: Randomizer, weighted choice, alias table, dice, jitter...
rand = ["dep:rand"]
# UUID helpers (v4 / v7 / short).
uuid = ["dep:uuid"]
# URL slug generation with unicode transliteration.
slug = ["dep:slug"]
# Password hashing strategies: PBKDF2 / bcrypt / argon2 / HMAC / SHA-2 / RSA / ECDSA / ECDH.
password = [
    "dep:pbkdf2",
    "dep:bcrypt",
    "dep:argon2",
    "dep:hmac",
    "dep:sha2",
    "dep:getrandom",
    "dep:rsa",
    "dep:p256",
]
# Cipher primitives: AES-CBC / AES-GCM / RSA-OAEP / ECDSA+ECDH P-256 / HMAC / SHA-2;
# application-level Encryptor ("enc:" prefix) + payload envelope (serde_json).
crypto = [
    "dep:aes",
    "dep:cbc",
    "dep:aes-gcm",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:getrandom",
    "dep:rsa",
    "dep:p256",
    "dep:serde_json",
]
# OTP(RFC 4226 HOTP / RFC 6238 TOTP 三摘要、otpauth:// URI)与 RFC 4648 base32 编解码。
otp = ["dep:hmac", "dep:sha1", "dep:sha2"]
# JWT generate / parse / verify / refresh, built on jsonwebtoken.
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:getrandom"]
# HTML → PDF 渲染（本机 Chrome/Edge CDP 驱动，自动探测安装路径）。
printrender = ["dep:chromiumoxide", "dep:futures-util", "dep:tokio"]
# Random name / nickname generator (embedded Chinese/English/Japanese dictionaries).
name-generator = ["rand"]
# Glob-style path matching in fsutil.
glob = ["dep:glob"]
# Bank card BIN lookup + Luhn validation.
bank-card = []
# QR 码生成:矩阵/SVG/终端块字符;PNG 需再开 `qrcode-png`(复用 image)。
qrcode = ["dep:qrcode"]
qrcode-png = ["qrcode", "dep:image"]

# 国密 SM2/SM3/SM4(基于 libsm;SM2 含 C1C3C2/ASN.1 加解密与签名验签)。
# 依赖 crypto 提供的 PKCS#7 填充与 Cipher trait。
sm = ["crypto", "dep:libsm", "dep:num-bigint"]
# 图形验证码服务:文本四类(数字/字母/算术/中文)+ 滑块/点选/
# 旋转,自绘渲染,输出 JSON 与 base64Captcha 前端组件兼容;存储层默认内存实现。
captcha = ["dep:image", "dep:rand", "dep:serde", "dep:serde_json"]
# 验证码 Redis 存储(基于 redis 阻塞客户端)。
captcha-redis = ["captcha", "dep:redis"]
# TLS 证书加载:从 PEM 文件/字节组装 rustls 服务端/客户端配置。
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs"]
# IP 归属地查询:qqwry(GB18030)、ip2region xdb v2、MaxMind 读取器。
geoip = ["dep:maxminddb", "dep:encoding_rs", "dep:serde"]
# 翻译器:百度/阿里/谷歌/火山四后端(阻塞 HTTP,ureq;
# 时间戳与 nonce 复用 chrono/uuid,签名复用 md-5/sha1/hmac/sha2)。
translator = ["dep:ureq", "dep:md-5", "dep:sha1", "dep:hmac", "dep:sha2", "dep:serde", "dep:serde_json", "dep:chrono", "dep:uuid", "dep:rand"]
# 分布式锁:Locker/Lock 接口与获取选项(Redis/etcd 后端见各自 feature)。
distlock = []
# 分布式锁的 Redis 落地(兼容 bsm/redislock 线上协议)。
distlock-redis = ["distlock", "dep:redis", "dep:getrandom"]
# SSRF 防护与可信代理链客户端 IP(纯 std,全局信任网段)。
netutil = []
# 进程内事件总线:订阅/发布 + 中间件链 + 多总线管理(纯 std)。
eventbus = []
# PostgreSQL 词法级 SQL 脱敏与表提取(纯 std)。
sqlutil = []
# REST 路径 / operationID 到 resource:action 权限码映射(纯 std)。
converter = []
# 对象存储辅助:MIME/魔数到桶与扩展名、文件名策略、上传守卫。
ossutil = ["dep:getrandom", "dep:sha2", "dep:hmac"]
# SMTP 邮件发送(STARTTLS + 隐式 SSL),基于 lettre。
mailer = ["dep:lettre"]
# 纯文本提取:txt/md/csv/html/docx(zip+xml);PDF 单独开 `doctext-pdf`。
doctext = ["dep:zip", "dep:quick-xml"]
doctext-pdf = ["doctext", "dep:pdf-extract"]
# 审计日志:客户端 IP 提取 + 篡改证据链(确定性 prost 序列化哈希 + ECDSA-P256 DER 签名)。
auditutil = ["dep:prost", "dep:p256", "dep:sha2"]
# 授权管理器壳:Engine 抽象 + noop/deny-all 引擎 + 策略装载(fail-closed)。
authorizer = []
# 字段级读写裁剪(serde_json 路径语义,对齐上游 protoreflect 行为)。
fieldperm = ["dep:serde_json"]
# 多渠道通知:webhook/IM/邮件/SMS/vendor push,SSRF 守卫的 ureq 出站客户端。
notify = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:hmac", "dep:sha2", "dep:sha1", "dep:jsonwebtoken", "dep:getrandom", "dep:chrono", "mailer"]

# Everything above, minus the exotic bits.
full = [
    "sm",
    "captcha",
    "chrono",
    "fieldmask",
    "json",
    "rand",
    "uuid",
    "slug",
    "password",
    "crypto",
    "jwt",
    "name-generator",
    "glob",
    "bank-card",
    "tls",
    "geoip",
    "translator",
    "distlock",
    "netutil",
    "eventbus",
    "sqlutil",
    "converter",
    "ossutil",
    "mailer",
    "doctext",
    "auditutil",
    "authorizer",
    "fieldperm",
    "notify",
    "qrcode",
    "xlsx",
    "mapper",
    "code-generator",
]

# Excel(xlsx)读写:calamine 读 + rust_xlsxwriter 写。
xlsx = ["dep:calamine", "dep:rust_xlsxwriter"]
# 模板驱动代码生成:mustache 子集渲染(serde_json 上下文)+ 落盘守卫。
code-generator = ["dep:serde_json"]
# entity ↔ DTO 字段映射(serde_json 桥:rename/枚举转换/缺省/剔除)。
mapper = ["dep:serde_json", "dep:serde"]
# casbin 引擎落地(authorizer 的 "casbin" 类型;未启用时该类型 DenyAll 兜底)。
authorizer-casbin = ["authorizer", "dep:casbin", "dep:tokio"]
# etcd 落地(lease+txn 抢锁;消费 block_wait 选项)。
distlock-etcd = ["distlock", "dep:etcd-client", "dep:tokio", "dep:getrandom"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
image = { version = "0.25", optional = true }
rand = { version = "0.9", features = ["small_rng"], optional = true }
uuid = { version = "1", features = ["v4", "v7"], optional = true }
slug = { version = "0.1", optional = true }
glob = { version = "0.3", optional = true }

pbkdf2 = { version = "0.12", optional = true }
bcrypt = { version = "0.15", optional = true }
argon2 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
# `oid` 为 RSA PKCS#1 v1.5 签名(SigningKey<Sha256>)所需
sha2 = { version = "0.10", features = ["oid"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["std"], optional = true }
aes-gcm = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
rsa = { version = "0.9", optional = true }
p256 = { version = "0.13", features = ["ecdh"], optional = true }
libsm = { version = "0.6", optional = true }
num-bigint = { version = "0.4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
redis = { version = "1.7", optional = true }
jsonwebtoken = { version = "9", optional = true }
maxminddb = { version = "0.24", optional = true }
encoding_rs = { version = "0.8", optional = true }
ureq = { version = "2", optional = true }
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"], optional = true }
zip = { version = "4.2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.41", optional = true }
pdf-extract = { version = "0.12", optional = true }
prost = { version = "0.14", default-features = false, features = ["derive", "std"], optional = true }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.10", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
rust_xlsxwriter = { version = "0.79", optional = true }
calamine = { version = "0.38", optional = true }
# runtime-tokio 为 casbin 内部 cfg 所需(即便只用内存适配器也须开)
casbin = { version = "2", default-features = false, features = ["runtime-tokio"], optional = true }
etcd-client = { version = "0.14", optional = true }

# 基准测试(仅 `cargo bench` 时编译);关闭默认特性以精简依赖,
# 只保留 cargo bench 所需的 cargo_bench_support。
[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# qrcode 单测的扫码回读校验(仅测试编译,不进发布依赖)。
rqrr = "0.9"

[[bench]]
name = "stringcase"
harness = false

# ---- examples(带 feature 依赖的逐个声明 required-features,
# ---- 其余走自动发现,零 feature 的 `cargo build --examples` 可编译)

[[example]]
name = "jwt"
required-features = ["jwt"]

[[example]]
name = "id"
required-features = ["uuid"]

[[example]]
name = "otp"
required-features = ["otp"]

[[example]]
name = "qrcode"
required-features = ["qrcode", "qrcode-png"]

[[example]]
name = "netutil"
required-features = ["netutil"]

[[example]]
name = "eventbus"
required-features = ["eventbus"]

[[example]]
name = "query_parser"
required-features = ["json"]

[[example]]
name = "fieldmask"
required-features = ["fieldmask"]

[[example]]
name = "timeutil"
required-features = ["chrono"]

[[example]]
name = "password"
required-features = ["password"]

[[example]]
name = "crypto"
required-features = ["crypto"]

[[example]]
name = "authorizer"
required-features = ["authorizer"]

[[example]]
name = "converter"
required-features = ["converter"]

[[example]]
name = "sqlutil"
required-features = ["sqlutil"]

[[example]]
name = "bank_card"
required-features = ["bank-card"]

[[example]]
name = "xlsx"
required-features = ["xlsx"]

[[example]]
name = "code_generator"
required-features = ["code-generator"]

[[example]]
name = "mapper"
required-features = ["mapper"]

[[bench]]
name = "collections"
harness = false

[[bench]]
name = "parsers"
harness = false

# Crate-wide lint policy: no unsafe code, period.
[lints.rust]
unsafe_code = "forbid"

[profile.test]
opt-level = 1
