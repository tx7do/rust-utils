[package]
name = "rust-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A Rust toolbox ported from github.com/tx7do/go-utils: string/slice/map helpers, case conversion, math, ids, pagination, query parsing, DDL parsing, event loop and more."
license = "MIT"
repository = "https://github.com/tx7do/rust-utils"
readme = "README.md"
keywords = ["utils", "toolbox", "stringcase", "snowflake", "pagination"]
categories = ["development-tools", "utilities"]

[features]
default = []

# Time helpers (dateutil / timeutil), built on chrono.
chrono = ["dep:chrono"]
# JSON-flavored query parsing and JSON field rewriting.
json = ["dep:serde_json"]
# Random toolkit: Randomizer, weighted choice, alias table, dice, jitter...
rand = ["dep:rand"]
# UUID helpers (v4 / v7 / short).
uuid = ["dep:uuid"]
# URL slug generation with unicode transliteration.
slug = ["dep:slug"]
# Password hashing strategies: PBKDF2 / bcrypt / argon2 / HMAC / SHA-256 / SHA-512.
password = ["dep:pbkdf2", "dep:bcrypt", "dep:argon2", "dep:hmac", "dep:sha2", "dep:getrandom"]
# Cipher primitives: AES-CBC / AES-GCM / HMAC / SHA-2, with PKCS#7 padding.
crypto = ["dep:aes", "dep:cbc", "dep:aes-gcm", "dep:hmac", "dep:sha2", "dep:getrandom"]
# JWT generate / parse / verify / refresh, built on jsonwebtoken.
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:getrandom"]
# Random name / nickname generator (embedded Chinese/English/Japanese dictionaries).
name-generator = ["rand"]
# Glob-style path matching in fsutil.
glob = ["dep:glob"]
# Bank card BIN lookup + Luhn validation.
bank-card = []

# Everything above, minus the exotic bits.
full = [
    "chrono",
    "json",
    "rand",
    "uuid",
    "slug",
    "password",
    "crypto",
    "jwt",
    "name-generator",
    "glob",
    "bank-card",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", optional = true }
rand = { version = "0.9", features = ["small_rng"], optional = true }
uuid = { version = "1", features = ["v4", "v7"], optional = true }
slug = { version = "0.1", optional = true }
glob = { version = "0.3", optional = true }

pbkdf2 = { version = "0.12", optional = true }
bcrypt = { version = "0.15", optional = true }
argon2 = { version = "0.5", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["std"], optional = true }
aes-gcm = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
jsonwebtoken = { version = "9", optional = true }

# Crate-wide lint policy: no unsafe code, period.
[lints.rust]
unsafe_code = "forbid"

[profile.test]
opt-level = 1
